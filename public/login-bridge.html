<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logging in...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .box {
      width: min(420px, calc(100% - 32px));
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #ffffff;
      padding: 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Logging in...</h1>
    <p>Please wait.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.hash.slice(1))
    const token = params.get('token')
    const next = params.get('next') || '/dashboard'

    if (token) {
      localStorage.setItem('vergo_auth_token', token)
    }

    window.location.replace(next)
  </script>
</body>
</html>
